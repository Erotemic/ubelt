[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ubelt"
description = "A Python utility belt containing simple tools, a stdlib like feel, and extra batteries"
authors = [{name = "Jon Crall", email = "erotemic@gmail.com"}]
requires-python = ">=3.10"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["utility", "python", "hashing", "caching", "stdlib", "path", "pathlib", "dictionary", "download"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/Erotemic/ubelt"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ubelt", "ubelt.*"]
namespaces = false

[tool.setuptools.package-data]
ubelt = ["py.typed", "*.pyi", "_docs/*.txt", "_docs/*.md"]

[tool.setuptools.dynamic]
version = {attr = "ubelt.__version__"}
dependencies = {file = ["requirements/runtime.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
runtime = {file = ["requirements/runtime.txt"]}
tests = {file = ["requirements/tests.txt"]}
optional = {file = ["requirements/optional.txt"]}
dev = {file = ["requirements/dev.txt"]}
docs = {file = ["requirements/docs.txt"]}
types = {file = ["requirements/types.txt"]}
# Preserve the former "all" extra: runtime + testing + optional packages.
all = {file = ["requirements/runtime.txt", "requirements/tests.txt", "requirements/optional.txt"]}

[tool.xcookie]
tags = [ "purepy", "erotemic", "github", "mypy",]
mod_name = "ubelt"
repo_name = "ubelt"
rel_mod_parent_dpath = "."
os = ["all"]
min_python = '3.10'
author = "Jon Crall"
typed = true
use_uv = true
author_email = "erotemic@gmail.com"
description = "A Python utility belt containing simple tools, a stdlib like feel, and extra batteries"
#ci_cpython_versions=["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13.0-beta.2"]
ci_allow_failure = []
typecheck_extra_paths = ["tests/typecheck_consumer.py"]
enable_gpg = true
ci_pypi_trusted_publishing = true
ci_gpg_secret_transport = "direct_ci"
license = "Apache 2"
dev_status = "stable"
use_setup_py = false
use_pyproject_requirements = false
classifiers = [
    # List of classifiers available at:
    # https://pypi.python.org/pypi?%3Aaction=list_classifiers
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS',
    'Operating System :: POSIX :: Linux',
    'Typing :: Typed',
]

[tool.xcookie.setuptools]
keywords = ["utility", "python", "hashing", "caching", "stdlib", "path", "pathlib", "dictionary", "download"]

[tool.pytest.ini_options]
addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=docs --ignore-glob=htmlcov"
norecursedirs = ".git ignore build __pycache__ dev _skbuild docs htmlcov"
filterwarnings = [
    "default",
    "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning",
    "ignore:.*Define the __nice__ method for.*:Warning",
    "ignore:.*private pytest class or function.*:Warning",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    ".*  # pragma: no cover",
    ".*  # nocover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if trace is not None",
    "verbose = .*", 
    "^ *raise",
    "^ *pass *$",
    "if _debug:",
    "if __name__ == .__main__.:",
    ".*if six.PY2:",
    ".*if typing.TYPE_CHECKING:",
    ".*if TYPE_CHECKING:",
    "@typing.overload",
    "@overload",
]
omit = [
    "ubelt/__main__.py",
    "ubelt/_win32_links.py",
    "ubelt/_win32_jaraco.py",
     "*/setup.py",
]

[tool.codespell]
skip = ['./docs/build', './*.egg-info', './build', './htmlcov']
count = true
quiet-level = 3
ignore-words-list = ['wont', 'cant', 'ANS', 'doesnt', 'arent', 'ans', 'thats', 'datas', 'isnt']


[tool.mypy]
ignore_missing_imports = true
#ignore_errors = true

[tool.ty.rules]
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"
import-not-found = "ignore"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
# Enable Flake8 (E, F) and isort (I) rules.
select = ["E", "F", "I"]
# Ignore specific rules, for example, E501 (line too long) as it's handled by the formatter.
ignore = [
    "E501",  # line too long
    "E402",  # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
